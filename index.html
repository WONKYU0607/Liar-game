<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>라이어게임</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://cdn.jsdelivr.net/gh/dacapo1142/resource@main/fonts/DungGeunMo.woff') format('woff');
    }
  </style>
  <style>
    :root {
      --bg: #fdf6ec;
      --surface: #fef9f2;
      --card: #ffffff;
      --border: #e8d5b0;
      --accent: #e03030;
      --accent2: #2060e0;
      --text: #3a2410;
      --muted: #9a7a5a;
      --success: #2060e0;
      --pixel: 'Noto Sans KR', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    #root {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    /* ── 공통 ── */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 28px 24px;
      animation: fadeIn 0.3s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo { text-align: center; margin-bottom: 4px; }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: #e03030;
      color: white;
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:active { transform: scale(0.97); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    /* ── 홈 화면 ── */
    #screen-home {
      justify-content: center;
      gap: 12px;
    }

    .home-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .mode-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .mode-btn:active { transform: scale(0.98); }
    .mode-btn.selected {
      border-color: var(--accent);
      background: rgba(224, 48, 48, 0.08);
    }

    .mode-icon {
      font-size: 0;
      width: 72px;
      text-align: center;
      flex-shrink: 0;
    }

    .mode-info h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }
    .mode-info p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── 설정 화면 ── */
    .stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }

    .stepper-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: var(--card);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .stepper-btn:active { background: var(--border); }

    .stepper-val {
      font-family: 'Jua', sans-serif;
      font-size: 28px;
      color: var(--text);
      min-width: 60px;
      text-align: center;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cat-btn {
      padding: 14px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .cat-btn.selected {
      border-color: var(--accent);
      background: rgba(224, 48, 48, 0.08);
      color: var(--text);
    }
    .cat-btn:active { transform: scale(0.96); }

    .song-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .song-overlay.active { display: flex; }

    .song-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 40px;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .song-sheet-title {
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      text-align: center;
      margin-bottom: 20px;
      color: var(--text);
    }

    .song-era-btns { display: flex; flex-direction: column; gap: 10px; }

    .era-btn {
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
    }
    .era-btn:active { transform: scale(0.98); }
    .era-btn.selected { border-color: var(--accent); background: rgba(224, 48, 48, 0.08); }
    .era-sub { font-size: 12px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }

    /* ── 직접입력 모달 ── */
    .custom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 9300;
      align-items: flex-end;
      justify-content: center;
    }
    .custom-overlay.active { display: flex; }
    .custom-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 24px 22px 30px;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.25s ease;
    }
    .custom-title {
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text);
    }
    .custom-hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 14px;
    }
    .custom-input {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      line-height: 1.4;
      outline: none;
      box-sizing: border-box;
    }
    .custom-input:focus { border-color: var(--accent); }
    .custom-btns {
      display: flex; gap: 10px; margin-top: 14px;
    }
    .custom-btns .btn { flex: 1; }
    .custom-steps {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    /* ── 역할 확인 화면 ── */
    #screen-role {
      justify-content: space-between;
    }

    .player-indicator {
      text-align: center;
      margin-bottom: 32px;
    }

    .player-number {
      font-family: 'Jua', sans-serif;
      font-size: 64px;
      line-height: 1;
      color: #e03030;
    }

    .player-label {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    .role-card {
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .role-card.citizen {
      background: #eef4ff;
      border: 3px solid #2060e0;
      box-shadow: 0 4px 0 #003aaa;
    }

    .role-card.liar {
      background: #fff0f0;
      border: 3px solid #e03030;
      box-shadow: 0 4px 0 #a00000;
    }

    .role-card.hidden {
      background: #fffbe8;
      border: 3px solid #e8a020;
      box-shadow: 0 4px 0 #a06000;
      cursor: pointer;
    }

    .role-emoji {
      font-size: 0;
      margin-bottom: 8px;
      line-height:1;
      display:flex;
      justify-content:center;
    }

    .role-title {
      font-family: 'Jua', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .role-word {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .role-word.liar-text {
      font-size: 18px;
      color: #e03030;
      line-height: 1.6;
    }

    .tap-hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── 타이머 화면 ── */
    #screen-timer {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .timer-ring {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 32px auto;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
    }

    .timer-ring circle {
      fill: none;
      stroke-width: 8;
    }

    .timer-ring .bg { stroke: var(--border); }
    .timer-ring .progress {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-seconds {
      font-family: 'Jua', sans-serif;
      font-size: 52px;
      line-height: 1;
    }

    .timer-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 24px;
    }

    /* ── 투표 화면 ── */
    .vote-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .vote-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vote-item.selected {
      border-color: var(--accent);
      background: rgba(224, 48, 48, 0.08);
    }

    .vote-item:active { transform: scale(0.98); }

    .vote-player {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .vote-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jua', sans-serif;
      font-size: 16px;
      color: var(--muted);
    }

    .vote-name { font-size: 15px; font-weight: 500; }

    .vote-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }

    .vote-item.selected .vote-check {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* ── 결과 화면 ── */
    #screen-result {
      align-items: center;
      text-align: center;
    }

    .result-badge {
      font-size: 72px;
      margin: 24px 0;
    }

    .result-title {
      font-family: 'Jua', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .result-desc {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.7;
    }

    .reveal-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }

    .reveal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .reveal-item.is-liar {
      border-color: #e03030;
      background: rgba(224, 48, 48, 0.06);
    }

    .reveal-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reveal-role-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    .badge-liar {
      background: rgba(224, 48, 48, 0.15);
      color: #e03030;
    }

    .badge-citizen {
      background: rgba(32, 96, 224, 0.12);
      color: #2060e0;
    }

    .reveal-word {
      font-size: 14px;
      color: var(--muted);
    }

    .result-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* ── 스크롤 ── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-area::-webkit-scrollbar { display: none; }

    /* ── 하단 고정 버튼 ── */
    .bottom-btn {
      padding-top: 16px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    .gap-12 { display: flex; flex-direction: column; gap: 12px; }
    .mt-auto { margin-top: auto; }
    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-24 { margin-bottom: 24px; }
    .text-center { text-align: center; }
    .text-muted { color: var(--muted); font-size: 13px; }
  </style>
  <style>
    /* ── 인트로 (글래스 가득 줌인 → 페이드 → 게임 UI) ── */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: #74caed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    #intro-overlay.fade { opacity: 0; }
    #intro-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      transform: scale(1);
      transform-origin: 49.95% 38.15%;
      transition: transform 1.1s cubic-bezier(0.45, 0, 0.55, 0.2);
      will-change: transform;
    }
    /* 게임 배경: 오락기 글래스 톤 */
    body {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 38%),
        linear-gradient(180deg, #7fd4f0 0%, #5cc0e8 100%);
      background-attachment: fixed;
    }
    /* 홈 제목 */
    .game-title {
      font-family: 'DungGeunMo', 'Noto Sans KR', sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #0a3a66;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255,255,255,0.55);
      margin-bottom: 4px;
    }
    .song-overlay { z-index: 9300; }

    /* 음소거 토글 버튼 */
    #sound-toggle {
      position: fixed;
      top: 14px; right: 14px;
      z-index: 8000;
      width: 44px; height: 44px;
      border: none; background: transparent;
      cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(255,255,255,0.65));
    }
    #sound-toggle:active { transform: scale(0.9); }
    #sound-toggle svg { display: block; }
  </style>
</head>
<body>

<!-- ── 인트로 ── -->
<div id="intro-overlay">
  <img id="intro-img" src="./arcade.png" alt="라이어게임" />
</div>

<!-- 음소거 토글 -->
<button id="sound-toggle" aria-label="음소거 전환"></button>

<div id="root">

  <!-- ── 홈 ── -->
  <div id="screen-home" class="screen active">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="game-title">라이어게임</div>
      <div class="subtitle" style="font-size:12px; color:#9a7a5a; letter-spacing:2px;">누가 거짓말을 하고 있을까?</div>

      <div class="section-label">모드 선택</div>
      <div class="home-btns">
        <button class="mode-btn selected" onclick="selectMode('basic')" id="btn-basic">
          <div class="mode-icon" style="font-size:0"><img src="./char-citizen.png" alt="" style="height:82px;width:auto;display:inline-block" /></div>
          <div class="mode-info">
            <h3>기본 모드</h3>
            <p>라이어는 제시어 없이 시작<br>시민들의 힌트로 버텨야 함</p>
          </div>
        </button>
        <button class="mode-btn" onclick="selectMode('spy')" id="btn-spy">
          <div class="mode-icon" style="font-size:0"><img src="./char-spy.png" alt="" style="height:82px;width:auto;display:inline-block" /></div>
          <div class="mode-info">
            <h3>스파이 모드</h3>
            <p>모두 시민이지만 한 명만<br>살짝 다른 단어를 받음</p>
          </div>
        </button>
      </div>
    </div>

    <div class="bottom-btn">
      <button class="btn btn-primary" onclick="goToSetup()">다음</button>
    </div>
  </div>

  <!-- ── 설정 ── -->
  <div id="screen-setup" class="screen">
    <div class="logo" style="font-size:24px; margin-bottom:24px;">게임 설정</div>

    <div class="scroll-area">
      <div class="card">
        <div class="section-label">플레이어 수</div>
        <div class="stepper">
          <button class="stepper-btn" onclick="changePlayer(-1)">−</button>
          <span class="stepper-val" id="player-count">4</span>
          <button class="stepper-btn" onclick="changePlayer(1)">+</button>
        </div>
      </div>

      <div class="card">
        <div class="section-label">라이어 수</div>
        <div class="stepper">
          <button class="stepper-btn" onclick="changeLiar(-1)">−</button>
          <span class="stepper-val" id="liar-count">1</span>
          <button class="stepper-btn" onclick="changeLiar(1)">+</button>
        </div>
        <div class="text-muted" style="margin-top:10px; text-align:center;">최대 3명</div>
      </div>

      <div class="card">
        <div class="section-label">토론 시간</div>
        <div class="stepper">
          <button class="stepper-btn" onclick="changeTime(-60)">−</button>
          <span class="stepper-val" id="timer-setup">3<span style="font-size:16px;">분</span></span>
          <button class="stepper-btn" onclick="changeTime(60)">+</button>
        </div>
        <div class="text-muted" style="margin-top:10px; text-align:center;" id="timer-desc">180초</div>
      </div>

      <div class="card">
        <div class="section-label">카테고리</div>
        <div class="category-grid" id="category-grid"></div>
      </div>
    </div>

    <div class="bottom-btn gap-12">
      <button class="btn btn-primary" onclick="startGame()">게임 시작</button>
      <button class="btn btn-ghost" onclick="goTo('home')">뒤로</button>
    </div>
  </div>

  <!-- ── 역할 확인 ── -->
  <div id="screen-role" class="screen">
    <div class="player-indicator">
      <div class="player-number" id="role-player-num">1</div>
      <div class="player-label">번 플레이어 확인 중</div>
    </div>

    <div id="role-card-area" style="flex:1; display:flex; flex-direction:column;">
      <div class="role-card hidden" id="role-card" onclick="revealRole()">
        <div class="role-emoji">👆</div>
        <div class="role-title">탭해서 확인</div>
        <div class="tap-hint">다른 사람이 보지 못하게 하세요</div>
      </div>
    </div>

    <div class="bottom-btn gap-12">
      <button class="btn btn-primary" id="role-next-btn" onclick="nextPlayer()" style="display:none;">
        다음 플레이어 →
      </button>
      <button class="btn btn-ghost" id="role-reroll-btn" onclick="rerollWord()" style="display:none;">
        ↩ 다른 단어로 바꾸기
      </button>
    </div>
  </div>

  <!-- ── 타이머 ── -->
  <div id="screen-timer" class="screen">
    <div class="logo" style="font-size:22px;">토론 시간</div>
    <div class="text-muted mb-16">모두 돌아가며 힌트를 말하세요</div>

    <div class="timer-ring">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle class="bg" cx="100" cy="100" r="88" />
        <circle class="progress" id="timer-circle" cx="100" cy="100" r="88"
          stroke-dasharray="553"
          stroke-dashoffset="0" />
      </svg>
      <div class="timer-text">
        <div class="timer-seconds" id="timer-display">180</div>
        <div class="timer-label" style="font-family:'Jua',sans-serif;">초</div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="btn btn-secondary" style="flex:1" onclick="toggleTimer()" id="timer-toggle-btn">⏸ 일시정지</button>
      <button class="btn btn-ghost" style="flex:1" onclick="goToVote()">투표 →</button>
    </div>
  </div>

  <!-- ── 투표 ── -->
  <div id="screen-vote" class="screen">
    <div class="logo" style="font-size:22px; margin-bottom:8px;">투표</div>
    <div class="text-muted mb-24">라이어라고 생각하는 플레이어를 선택하세요</div>

    <div class="scroll-area">
      <div class="vote-list" id="vote-list"></div>
    </div>

    <div class="bottom-btn">
      <button class="btn btn-primary" onclick="showResult()" id="vote-confirm-btn">결과 확인</button>
    </div>
  </div>

  <!-- ── 결과 ── -->
  <div id="screen-result" class="screen">
    <div class="result-badge" id="result-badge">🎭</div>
    <div class="result-title" id="result-title">결과</div>
    <div class="result-desc" id="result-desc"></div>

    <div class="reveal-cards" id="reveal-cards"></div>

    <div class="result-btns">
      <button class="btn btn-primary" id="btn-play-again" onclick="playAgain()">같은 설정으로 다시</button>
      <button class="btn btn-ghost" onclick="exitToHome()">처음으로</button>
    </div>
  </div>

</div>

<script>
  // ── 상태 ──
  let state = {
    mode: 'basic',
    players: 4,
    liars: 1,
    timerSecs: 180,
    categories: ['동물'],
    currentPlayer: 0,
    roles: [],        // { player: N, isLiar: bool, word: str }
    revealed: false,
    timerInterval: null,
    timerRemain: 180,
    timerRunning: false,
    votedFor: null,
    words: {},
    wordQueue: [],
    customWords: [],
    currentWordObj: null
  };

  const CATEGORIES = ['동물','직업','음식','국가','랜드마크','축구선수','스포츠스타','스포츠종목','역사인물','생활용품','브랜드','유명도시','연예인','노래','직접입력'];
  const SONG_CATS = ['노래(70-80년대)', '노래(00-20년대)'];
  const CAT_DISPLAY = { '스포츠스타': '스포츠 스타', '스포츠종목': '스포츠 종목' };
  const catLabel = (c) => CAT_DISPLAY[c] || c;

  // ── 사운드 시스템 ──
  const Sound = (() => {
    const files = {
      click: './sounds/click.mp3',
      reveal: './sounds/reveal.mp3',
      timerStart: './sounds/timer-start.mp3',
      countdown: './sounds/countdown.mp3',
      win: './sounds/win.mp3',
      lose: './sounds/lose.mp3',
    };
    const cache = {};
    Object.entries(files).forEach(([k, v]) => {
      const a = new Audio(v); a.preload = 'auto'; cache[k] = a;
    });
    let muted = localStorage.getItem('liar_muted') === '1';
    let bgm = null;
    function play(name) {
      if (muted) return;
      const a = cache[name]; if (!a) return;
      try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
    }
    function playBgm(name) {
      stopBgm();
      if (muted) return;
      const a = cache[name]; if (!a) return;
      try { a.currentTime = 0; a.play().catch(() => {}); bgm = a; } catch (e) {}
    }
    function stopBgm() {
      if (bgm) { try { bgm.pause(); bgm.currentTime = 0; } catch (e) {} bgm = null; }
    }
    function updateBtn() {
      const b = document.getElementById('sound-toggle');
      if (!b) return;
      const ICON_ON = '<svg viewBox="0 0 32 32" width="30" height="30" shape-rendering="crispEdges"><g fill="#0a3a66"><rect x="3" y="12" width="6" height="8"/><polygon points="9,12 16,5 16,27 9,20"/><rect x="19" y="13" width="3" height="3"/><rect x="21" y="16" width="3" height="3"/><rect x="19" y="19" width="3" height="3"/><rect x="24" y="10" width="3" height="3"/><rect x="26" y="13" width="3" height="3"/><rect x="27" y="16" width="3" height="3"/><rect x="26" y="19" width="3" height="3"/><rect x="24" y="22" width="3" height="3"/></g></svg>';
      const ICON_OFF = '<svg viewBox="0 0 32 32" width="30" height="30" shape-rendering="crispEdges"><g fill="#0a3a66"><rect x="3" y="12" width="6" height="8"/><polygon points="9,12 16,5 16,27 9,20"/></g><g fill="#e03030"><rect x="19" y="11" width="3" height="3"/><rect x="22" y="14" width="3" height="3"/><rect x="25" y="17" width="3" height="3"/><rect x="28" y="20" width="3" height="3"/><rect x="28" y="11" width="3" height="3"/><rect x="25" y="14" width="3" height="3"/><rect x="22" y="17" width="3" height="3"/><rect x="19" y="20" width="3" height="3"/></g></svg>';
      b.innerHTML = muted ? ICON_OFF : ICON_ON;
    }
    function toggleMute() {
      muted = !muted;
      localStorage.setItem('liar_muted', muted ? '1' : '0');
      if (muted) stopBgm();
      updateBtn();
    }
    // 초기 버튼 상태 + 클릭 핸들러
    document.addEventListener('DOMContentLoaded', () => {
      const b = document.getElementById('sound-toggle');
      if (b) { b.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); }); updateBtn(); }
    });
    // 전역 클릭음 위임 (button, .mode-btn, .vote-item, .stepper-btn) — 음소거 버튼/카드 제외
    document.addEventListener('click', (e) => {
      const t = e.target.closest('button, .mode-btn, .vote-item, .stepper-btn');
      if (!t) return;
      if (t.id === 'sound-toggle') return;
      if (t.closest('.role-card')) return;  // 역할 카드는 reveal 사운드 별도
      play('click');
    }, true);
    return { play, playBgm, stopBgm };
  })();

  // ── 단어 DB 로드 ──
  async function loadWords() {
    try {
      const res = await fetch('./words.json');
      state.words = await res.json();
    } catch(e) {
      console.error('단어 로드 실패', e);
    }
  }
  loadWords();

  // ── 화면 전환 ──
  function goTo(id) {
    Sound.stopBgm();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
  }

  // ── 홈 ──
  function selectMode(mode) {
    state.mode = mode;
    document.getElementById('btn-basic').classList.toggle('selected', mode === 'basic');
    document.getElementById('btn-spy').classList.toggle('selected', mode === 'spy');
  }

  function goToSetup() {
    renderCategoryGrid();
    goTo('setup');
  }

  // ── 설정 ──
  function renderCategoryGrid() {
    const grid = document.getElementById('category-grid');
    grid.innerHTML = CATEGORIES.map(cat => {
      if (cat === '노래') {
        const selectedEra = SONG_CATS.find(s => state.categories.includes(s));
        const label = selectedEra ? selectedEra.replace('노래(', '').replace(')', '') : '노래';
        return `<button class="cat-btn ${selectedEra ? 'selected' : ''}" onclick="openSongOverlay()">${label}</button>`;
      }
      if (cat === '직접입력') {
        const sel = state.categories.includes('직접입력') ? 'selected' : '';
        return `<button class="cat-btn ${sel}" onclick="openCustomOverlay()">직접입력</button>`;
      }
      return `<button class="cat-btn ${state.categories.includes(cat) ? 'selected' : ''}"
              onclick="toggleCategory('${cat}')">${catLabel(cat)}</button>`;
    }).join('');
  }

  function toggleCategory(cat) {
    state.categories = [cat];
    renderCategoryGrid();
  }

  function changePlayer(d) {
    state.players = Math.max(3, Math.min(10, state.players + d));
    document.getElementById('player-count').textContent = state.players;
    const maxLiar = Math.min(3, Math.floor(state.players / 2));
    state.liars = Math.min(state.liars, maxLiar);
    document.getElementById('liar-count').textContent = state.liars;
  }

  function changeLiar(d) {
    const maxLiar = Math.min(3, Math.floor(state.players / 2));
    state.liars = Math.max(1, Math.min(maxLiar, state.liars + d));
    document.getElementById('liar-count').textContent = state.liars;
  }

  function changeTime(d) {
    const minSecs = 60;
    const maxSecs = 600;
    state.timerSecs = Math.max(minSecs, Math.min(maxSecs, state.timerSecs + d));
    const mins = Math.floor(state.timerSecs / 60);
    document.getElementById('timer-setup').innerHTML =
      `${mins}<span style="font-size:16px;">분</span>`;
    document.getElementById('timer-desc').textContent = `${state.timerSecs}초`;
  }

  // ── 단어 큐 관리 ──
  function getWordQueue(cat) {
    const key = 'queue_' + cat;
    if (!state.wordQueue[key] || state.wordQueue[key].length === 0) {
      const flippedKey = 'flipped_' + cat;
      // 이전 라운드가 뒤집기였는지 확인 → 번갈아가며 전환
      const wasFlipped = state.wordQueue[flippedKey] || false;
      const shouldFlip = !wasFlipped;
      state.wordQueue[flippedKey] = shouldFlip;

      const list = [...state.words[cat]];
      // 셔플
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      // 뒤집기 라운드면 word↔similar 교체
      state.wordQueue[key] = shouldFlip
        ? list.map(item => ({ word: item.similar[0], similar: [item.word] }))
        : list;

      if (shouldFlip) console.log(`[${cat}] 뒤집기 라운드 시작!`);
      else console.log(`[${cat}] 일반 라운드 시작!`);
    }
    return state.wordQueue[key];
  }

  function pickWord(cat) {
    const queue = getWordQueue(cat);
    return queue.shift();
  }

  // ── 게임 시작 ──
  function startGame() {
    if (!Object.keys(state.words).length) {
      alert('단어 DB를 불러오는 중입니다. 잠시 후 다시 시도하세요.');
      return;
    }

    const availableCats = state.categories.filter(c => state.words[c]);
    if (!availableCats.length) { alert('카테고리를 선택하세요.'); return; }

    const cat = availableCats[Math.floor(Math.random() * availableCats.length)];
    state.currentCat = cat;
    state.currentWordObj = pickWord(cat);

    assignRoles(state.currentWordObj);
    state.currentPlayer = 0;
    state.revealed = false;
    renderRoleScreen();
    goTo('role');
  }

  function assignRoles(wordObj) {
    const citizenWord = wordObj.word;
    let liarWord = citizenWord;
    if (state.mode === 'spy' && wordObj.similar?.length) {
      liarWord = wordObj.similar[Math.floor(Math.random() * wordObj.similar.length)];
    }
    const playerNums = Array.from({length: state.players}, (_, i) => i + 1);
    const liarPlayers = [...playerNums].sort(() => Math.random() - 0.5).slice(0, state.liars);
    state.roles = playerNums.map(n => ({
      player: n,
      isLiar: liarPlayers.includes(n),
      word: liarPlayers.includes(n) ? liarWord : citizenWord
    }));
  }

  function rerollWord() {
    state.currentWordObj = pickWord(state.currentCat);
    const citizenWord = state.currentWordObj.word;
    let liarWord = citizenWord;
    if (state.mode === 'spy' && state.currentWordObj.similar?.length) {
      liarWord = state.currentWordObj.similar[Math.floor(Math.random() * state.currentWordObj.similar.length)];
    }
    // 라이어 배정은 그대로, 단어만 교체
    state.roles = state.roles.map(r => ({
      ...r,
      word: r.isLiar ? liarWord : citizenWord
    }));
    state.revealed = false;
    renderRoleScreen();
  }

  // ── 역할 확인 ──
  function renderRoleScreen() {
    const idx = state.currentPlayer;
    document.getElementById('role-player-num').textContent = idx + 1;
    document.getElementById('role-next-btn').style.display = 'none';
    document.getElementById('role-reroll-btn').style.display = 'none';
    state.revealed = false;

    const card = document.getElementById('role-card');
    card.className = 'role-card hidden';
    card.onclick = revealRole;
    card.innerHTML = `
      <div class="role-emoji" style="font-size:0"><img src="./char-liar.png" alt="" style="height:120px;width:auto;display:block" /></div>
      <div class="role-title">탭해서 확인</div>
      <div class="tap-hint">다른 사람이 보지 못하게 하세요</div>
    `;
  }

  function revealRole() {
    if (state.revealed) return;
    state.revealed = true;
    Sound.play('reveal');

    const role = state.roles[state.currentPlayer];
    const card = document.getElementById('role-card');
    card.onclick = null;

    if (role.isLiar) {
      card.className = 'role-card liar';
      if (state.mode === 'spy') {
        card.innerHTML = `
          <div class="role-emoji">👥</div>
          <div class="role-title" style="color:#2060e0; text-shadow:2px 2px 0 #003aaa;">시민</div>
          <div class="role-word">${role.word}</div>
          <div class="tap-hint" style="margin-top:16px;">제시어를 기억하세요<br>라이어를 찾아내세요</div>
        `;
        card.className = 'role-card citizen';
      } else {
        card.innerHTML = `
          <div class="role-emoji">🎭</div>
          <div class="role-title" style="color:#e03030; text-shadow:2px 2px 0 #a00000;">라이어</div>
          <div class="role-word liar-text">당신은 라이어입니다<br>제시어를 모릅니다<br>시민처럼 행동하세요</div>
        `;
      }
    } else {
      card.className = 'role-card citizen';
      card.innerHTML = `
        <div class="role-emoji">👥</div>
        <div class="role-title" style="color:#2060e0; text-shadow:2px 2px 0 #003aaa;">시민</div>
        <div class="role-word">${role.word}</div>
        <div class="tap-hint" style="margin-top:16px;">제시어를 기억하세요<br>라이어를 찾아내세요</div>
      `;
    }

    const isLast = state.currentPlayer >= state.players - 1;
    const btn = document.getElementById('role-next-btn');
    btn.style.display = 'block';
    btn.textContent = isLast ? '토론 시작 🗣️' : `다음 플레이어 →`;

    // 1번 플레이어일 때 항상 교체 버튼 표시
    const rerollBtn = document.getElementById('role-reroll-btn');
    rerollBtn.style.display = state.currentPlayer === 0 ? 'block' : 'none';
  }

  function nextPlayer() {
    state.currentPlayer++;
    if (state.currentPlayer >= state.players) {
      startTimer();
      goTo('timer');
    } else {
      renderRoleScreen();
    }
  }

  // ── 타이머 ──
  function startTimer() {
    clearInterval(state.timerInterval);
    state.timerRemain = state.timerSecs;
    state.timerRunning = true;
    Sound.play('timerStart');
    updateTimerUI();
    state.timerInterval = setInterval(tickTimer, 1000);
    document.getElementById('timer-toggle-btn').textContent = '⏸ 일시정지';
  }

  function tickTimer() {
    if (!state.timerRunning) return;
    state.timerRemain--;
    if (state.timerRemain === 10) Sound.playBgm('countdown');
    updateTimerUI();
    if (state.timerRemain <= 0) {
      clearInterval(state.timerInterval);
      goToVote();
    }
  }

  function updateTimerUI() {
    document.getElementById('timer-display').textContent = state.timerRemain;
    const circ = document.getElementById('timer-circle');
    const total = 553;
    const progress = state.timerRemain / state.timerSecs;
    circ.style.strokeDashoffset = total * (1 - progress);

    // 남은 시간에 따라 색 변경
    if (state.timerRemain <= 30) {
      circ.style.stroke = '#e03030';
    } else if (state.timerRemain <= 60) {
      circ.style.stroke = '#e8a020';
    } else {
      circ.style.stroke = '#2060e0';
    }
  }

  function toggleTimer() {
    state.timerRunning = !state.timerRunning;
    document.getElementById('timer-toggle-btn').textContent =
      state.timerRunning ? '⏸ 일시정지' : '▶ 재개';
  }

  function goToVote() {
    clearInterval(state.timerInterval);
    renderVoteList();
    goTo('vote');
  }

  // ── 투표 ──
  function renderVoteList() {
    state.votedFor = null;
    const list = document.getElementById('vote-list');
    list.innerHTML = Array.from({length: state.players}, (_, i) => `
      <div class="vote-item" id="vote-${i+1}" onclick="selectVote(${i+1})">
        <div class="vote-player">
          <div class="vote-avatar">${i+1}</div>
          <div class="vote-name">${i+1}번 플레이어</div>
        </div>
        <div class="vote-check" id="check-${i+1}"></div>
      </div>
    `).join('');
  }

  function selectVote(n) {
    // 이전 선택 해제
    if (state.votedFor) {
      document.getElementById('vote-' + state.votedFor).classList.remove('selected');
      document.getElementById('check-' + state.votedFor).textContent = '';
    }
    state.votedFor = n;
    document.getElementById('vote-' + n).classList.add('selected');
    document.getElementById('check-' + n).textContent = '✓';
  }

  // ── 결과 ──
  function showResult() {
    if (!state.votedFor) {
      alert('투표할 플레이어를 선택하세요.');
      return;
    }

    const votedRole = state.roles[state.votedFor - 1];
    const liarsCaught = votedRole.isLiar;

    document.getElementById('result-badge').innerHTML = liarsCaught
      ? `<img src="./char-citizen.png" alt="" style="height:104px;width:auto;display:inline-block" />`
      : `<img src="./char-liar.png" alt="" style="height:104px;width:auto;display:inline-block" />`;
    document.getElementById('result-title').textContent = liarsCaught ? '시민 승리!' : '라이어 승리!';
    document.getElementById('result-desc').textContent = liarsCaught
      ? `${state.votedFor}번 플레이어가 라이어였습니다!\n시민들이 라이어를 찾아냈어요.`
      : `${state.votedFor}번 플레이어는 시민이었습니다!\n라이어가 살아남았어요.`;

    // 전체 역할 공개
    const cards = document.getElementById('reveal-cards');
    cards.innerHTML = state.roles.map(r => `
      <div class="reveal-item ${r.isLiar ? 'is-liar' : ''}">
        <div class="reveal-left">
          <div class="vote-avatar" style="width:36px;height:36px;font-size:14px;">${r.player}</div>
          <span class="reveal-role-badge ${r.isLiar ? 'badge-liar' : 'badge-citizen'}">
            ${r.isLiar ? (state.mode === 'spy' ? '스파이(시민)' : '라이어') : '시민'}
          </span>
        </div>
        <div class="reveal-word">${r.isLiar && state.mode !== 'spy' ? '제시어 없음' : r.word}</div>
      </div>
    `).join('');

    goTo('result');
    const playAgainBtn = document.getElementById('btn-play-again');
    if (playAgainBtn) playAgainBtn.style.display = state.categories.includes('직접입력') ? 'none' : '';
    Sound.playBgm(liarsCaught ? 'win' : 'lose');
  }

  function playAgain() {
    startGame();
    goTo('role');
  }

  function openSongOverlay() {
    document.getElementById('song-overlay').classList.add('active');
    const eras = ['노래(70-80년대)', '노래(00-20년대)'];
    const ids = ['era-7080', 'era-0020'];
    eras.forEach((era, i) => {
      document.getElementById(ids[i]).classList.toggle('selected', state.categories.includes(era));
    });
  }

  function closeSongOverlay(e) {
    if (e.target === document.getElementById('song-overlay')) {
      document.getElementById('song-overlay').classList.remove('active');
    }
  }

  function selectEra(era) {
    state.categories = [era];
    document.getElementById('song-overlay').classList.remove('active');
    renderCategoryGrid();
  }

  // ── 직접입력 모달 ──
  let _customForm = { step: 1, citizen: '', spy: '' };

  function openCustomOverlay() {
    _customForm = { step: 1, citizen: '', spy: '' };
    renderCustomSheet();
    document.getElementById('custom-overlay').classList.add('active');
  }
  function closeCustomOverlay(e) {
    if (e && e.target !== document.getElementById('custom-overlay')) return;
    document.getElementById('custom-overlay').classList.remove('active');
  }

  function renderCustomSheet() {
    const sheet = document.getElementById('custom-sheet');
    const isSpy = state.mode === 'spy';
    const step = _customForm.step;
    let html = '';

    if (!isSpy) {
      // 기본 모드: 단어 1개
      html = `
        <div class="custom-title">제시어 입력</div>
        <div class="custom-hint">시민에게 보여줄 단어 하나</div>
        <input type="text" id="custom-w" class="custom-input" maxlength="30" />
        <div class="custom-btns">
          <button class="btn btn-ghost" onclick="closeCustomOverlay()">취소</button>
          <button class="btn btn-primary" onclick="saveCustomWords()">확인</button>
        </div>`;
    } else if (step === 1) {
      // 스파이 1단계: 시민 단어
      html = `
        <div class="custom-steps">1 / 2</div>
        <div class="custom-title">시민 제시어</div>
        <div class="custom-hint">시민들이 받을 단어</div>
        <input type="text" id="custom-w" class="custom-input" maxlength="30" />
        <div class="custom-btns">
          <button class="btn btn-ghost" onclick="closeCustomOverlay()">취소</button>
          <button class="btn btn-primary" onclick="customNext()">다음</button>
        </div>`;
    } else {
      // 스파이 2단계: 스파이 단어
      html = `
        <div class="custom-steps">2 / 2</div>
        <div class="custom-title">스파이 제시어</div>
        <div class="custom-hint">스파이가 받을 단어 (살짝 다르게)</div>
        <input type="text" id="custom-w" class="custom-input" maxlength="30" />
        <div class="custom-btns">
          <button class="btn btn-ghost" onclick="customBack()">뒤로</button>
          <button class="btn btn-primary" onclick="saveCustomWords()">확인</button>
        </div>`;
    }
    sheet.innerHTML = html;
    const input = document.getElementById('custom-w');
    if (input) {
      if (isSpy) input.value = (step === 1 ? _customForm.citizen : _customForm.spy);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (isSpy && step === 1) customNext(); else saveCustomWords();
        }
      });
      setTimeout(() => input.focus(), 50);
    }
  }

  function customNext() {
    const v = (document.getElementById('custom-w').value || '').trim();
    if (!v) { alert('단어를 입력해주세요.'); return; }
    _customForm.citizen = v;
    _customForm.step = 2;
    renderCustomSheet();
  }
  function customBack() {
    const v = (document.getElementById('custom-w').value || '').trim();
    _customForm.spy = v;
    _customForm.step = 1;
    renderCustomSheet();
  }
  function saveCustomWords() {
    const v = (document.getElementById('custom-w').value || '').trim();
    if (!v) { alert('단어를 입력해주세요.'); return; }
    const isSpy = state.mode === 'spy';
    let citizen, spy;
    if (isSpy) {
      _customForm.spy = v;
      citizen = _customForm.citizen;
      spy = _customForm.spy;
      if (citizen === spy) { alert('시민과 스파이의 단어가 같아요.'); return; }
    } else {
      citizen = v;
      spy = v;
    }
    state.customWords = isSpy ? [citizen, spy] : [citizen];
    state.words['직접입력'] = [{ word: citizen, similar: [spy] }];
    delete state.wordQueue['queue_직접입력'];
    delete state.wordQueue['flipped_직접입력'];
    state.categories = ['직접입력'];
    document.getElementById('custom-overlay').classList.remove('active');
    renderCategoryGrid();
    setTimeout(() => startGame(), 200);
  }

  function resetCustomIfUsed() {
    if (!state.categories.includes('직접입력')) return;
    state.customWords = [];
    state.categories = ['동물'];
    delete state.words['직접입력'];
    delete state.wordQueue['queue_직접입력'];
    delete state.wordQueue['flipped_직접입력'];
  }

  // ── 리뷰 요청 모달 ──
  const REVIEW_KEY = 'liar_review_shown';
  function exitToHome() {
    resetCustomIfUsed();
    renderCategoryGrid();
    goTo('home');
    setTimeout(() => maybeShowReview(), 350);
  }
  function maybeShowReview() {
    if (localStorage.getItem(REVIEW_KEY) === '1') return false;
    document.getElementById('review-overlay').classList.add('active');
    return true;
  }
  function closeReviewOverlay(e) {
    if (e && e.target !== document.getElementById('review-overlay')) return;
    dismissReview();
  }
  function dismissReview() {
    localStorage.setItem(REVIEW_KEY, '1');
    document.getElementById('review-overlay').classList.remove('active');
  }
  function openReviewLink() {
    localStorage.setItem(REVIEW_KEY, '1');
    document.getElementById('review-overlay').classList.remove('active');
    const pkg = 'com.wonkyu.liargame';
    const market = 'market://details?id=' + pkg;
    const web = 'https://play.google.com/store/apps/details?id=' + pkg;
    try { window.location.href = market; } catch (e) {}
    setTimeout(() => { window.open(web, '_blank'); }, 600);
  }
</script>

<script>
  // ── 인트로: 글래스가 화면을 가득 채울 때까지 줌인 → 페이드 → 게임 UI (기존 로직 미간섭) ──
  (function () {
    var ov  = document.getElementById('intro-overlay');
    var img = document.getElementById('intro-img');
    if (!ov || !img) return;

    // arcade.png 기준 글래스 내부 사각형 (natural px)
    var IMG_W = 1024, IMG_H = 1042;
    var GX0 = 395, GY0 = 295, GX1 = 628, GY1 = 500;

    // 글래스가 뷰포트를 완전히 덮는 scale 계산 (cover)
    function coverScale() {
      var VW = window.innerWidth;
      var VH = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      var fit = Math.min(VW / IMG_W, VH / IMG_H);
      var IW = IMG_W * fit, IH = IMG_H * fit;
      var ILx = (VW - IW) / 2, ILy = (VH - IH) / 2;
      var OX = ((GX0 + GX1) / 2) / IMG_W, OY = ((GY0 + GY1) / 2) / IMG_H;
      var Oxb = IW * OX, Oyb = IH * OY;
      // 글래스 중심의 화면상 고정 위치
      var cx = ILx + Oxb, cy = ILy + Oyb;
      var gW = (GX1 - GX0) * fit, gH = (GY1 - GY0) * fit;
      // 중심에서 각 가장자리까지 거리를 글래스 절반폭/높이로 덮어야 함
      var needW = 2 * Math.max(cx, VW - cx) / gW;
      var needH = 2 * Math.max(cy, VH - cy) / gH;
      return {
        S: Math.max(needW, needH) * 1.02,   // 살짝 여유
        origin: (OX * 100).toFixed(3) + '% ' + (OY * 100).toFixed(3) + '%'
      };
    }

    var started = false;

    function finish() {
      if (started) return; started = true;
      var L = coverScale();
      img.style.transformOrigin = L.origin;
      void img.offsetWidth;
      img.style.transform = 'scale(' + L.S + ')';
      // 줌이 끝나갈 때 오버레이 페이드아웃 → 게임 UI 노출
      setTimeout(function () { ov.classList.add('fade'); }, 800);
      setTimeout(function () {
        if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
      }, 1280);
    }

    img.style.transformOrigin = coverScale().origin;     // 초기 origin
    var auto = setTimeout(finish, 1000);                 // 1초 후 자동 줌인
    ov.addEventListener('click', function () { clearTimeout(auto); finish(); });

    // 줌 시작 전 회전/리사이즈 시 origin 재계산
    function reflow() {
      if (started) return;
      img.style.transformOrigin = coverScale().origin;
    }
    window.addEventListener('resize', reflow);
    window.addEventListener('orientationchange', function () { setTimeout(reflow, 300); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', reflow);
  })();
</script>
